name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt ruff

    - name: Lint (pyflakes errors)
      run: ruff check dxforge scripts tests app.py --select F,E9

    - name: Train ML models (quick, re-trained for this environment)
      run: python scripts/train.py --quick

    - name: Unit + integration tests
      run: pytest -q

    - name: End-to-end benchmark
      run: python scripts/run_benchmark.py
